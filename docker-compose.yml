version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sprout-postgres
    environment:
      - POSTGRES_USER=sprout_user
      - POSTGRES_PASSWORD=sprout_password
      - POSTGRES_DB=Sprout
    ports:
      - "5432:5432"
    volumes:
      - sprout-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout_user -d Sprout"]
      interval: 10s
      timeout: 5s
      retries: 5

  sprout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sprout-app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=Sprout;Username=sprout_user;Password=sprout_password;Port=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sprout-postgres-data:
    driver: local
